    <circle r="56" stroke="#9DBD7E" stroke-opacity=".65"/>
    <path d="M-68 0a68 68 0 0 1 102-59M68 0a68 68 0 0 1-18 46" stroke="#80FF00" stroke-width="2" opacity=".52"/>
