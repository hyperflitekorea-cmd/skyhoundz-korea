  <g transform="translate(369 42) rotate(-17)">
    <ellipse rx="102" ry="28" fill="#80FF00" fill-opacity=".07" stroke="#9DBD7E" stroke-opacity=".65"/>
    <ellipse rx="83" ry="18" stroke="#80FF00" stroke-width="1.5" stroke-opacity=".48"/>
    <path d="M-102 0a102 28 0 0 0 102 28" stroke="#80FF00" stroke-width="3" stroke-opacity=".55"/>
  </g>

  <!-- Interrupted rings and a small solid sector echo the face of the disc. -->
